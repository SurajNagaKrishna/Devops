services:
  web:
    type: web
    name: taskflow-app
    env: node
    region: singapore
    plan: free
    branch: feature-tasks
    rootDir: Devops
    buildCommand: npm install && cd frontend && npm install && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 2000
      - key: DB_SSL
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: taskflow-db
    databaseName: taskflow_db
    user: taskflow_user
    plan: free
    region: singapore
